'use strict';
const URL='https://wvygznuoagdzybuqgcpk.supabase.co', KEY='sb_publishable_TCjgnwJzNYXqwyOnEe8sZQ_WUYcT-RJ';
const sb=window.supabase?.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={recovery:false,user:null,profile:null,org:null,requests:[],files:[],page:'home',mode:'login',mfa:null,loading:false,selected:null,notice:'',noticeType:'notice',working:false};
const say=(msg,kind='notice')=>{state.notice=msg;state.noticeType=kind;const el=$('feedback');if(el){el.className='notice '+kind;el.textContent=msg;el.hidden=false;}else if(msg)alert(msg)};
const loading=async(fn)=>{if(state.working)return;state.working=true;document.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=true);try{await fn()}catch(e){console.error(e);say(e.message||'An unexpected error occurred.','error')}finally{state.working=false;document.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=false)}};
const pill=s=>`<span class="pill ${s==='Completed'?'done':s==='In progress'||s==='In review'?'progress':''}">${esc(s)}</span>`;
async function start(){try{if(!sb){$('root').innerHTML='<div class="notice error">Supabase library could not be loaded. Check your internet connection.</div>';return}sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){state.recovery=true;showNewPassword()}});const {data,error}=await sb.auth.getUser();if(state.recovery){showNewPassword();return}if(error&&error.status!==400)console.warn(error);state.user=data?.user||null;await gate()}catch(e){console.error(e);auth('login');say('Could not initialise the application: '+(e.message||'Please try again.'),'error')}}
async function gate(){if(state.recovery){showNewPassword();return}if(!state.user){auth();return}const {data:aal,error}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(error){say(error.message,'error');auth();return}if(aal.currentLevel!=='aal2'){await showMfa();return}const {data:p,error:pe}=await sb.from('travel_profiles').select('*').eq('user_id',state.user.id).maybeSingle();if(pe){auth();say(pe.message,'error');return}state.profile=p;if(!p){onboard();return}try{await loadData();shell()}catch(e){console.error(e);auth('login');say('Could not load your account data: '+(e.message||'Unknown error'),'error')}}
async function showMfa(){const {data,error}=await sb.auth.mfa.listFactors();if(error){auth();say(error.message,'error');return}const verified=data?.totp?.find(f=>f.status==='verified');if(verified){state.mfa={kind:'challenge',id:verified.id};auth('mfa');return}const unverified=data?.totp?.find(f=>f.status==='unverified');if(unverified){await sb.auth.mfa.unenroll({factorId:unverified.id})}const enrolled=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Arcangel IRI Authenticator'});if(enrolled.error){auth();say(enrolled.error.message,'error');return}state.mfa={kind:'enroll',id:enrolled.data.id,qr:enrolled.data.totp.qr_code,secret:enrolled.data.totp.secret};auth('mfa')}
function auth(mode=state.mode){state.mode=mode;const m=mode==='mfa',signup=mode==='signup';$('root').innerHTML=`<section class="auth-layout"><div class="auth-visual"><div class="brand"><span class="mark">✦</span> Arcangel IRI<small>TRAVEL INTELLIGENCE</small></div><div><div class="eyebrow">SECURE INTELLIGENCE PORTAL</div><div class="auth-title">Safeguarding People.<br><em>Protecting Possibilities.</em></div><p style="max-width:500px;color:#cdd8e0;font-size:16px">Secure travel intelligence, destination analysis and direct access to your Arcangel Concierge Desk.</p></div><div class="auth-feature">Encrypted access · Multi-factor verification · Private intelligence reporting</div></div><div class="auth-card"><div class="logo"><span>✦</span> Arcangel IRI</div><div style="height:17px"></div><div class="eyebrow">${m?'IDENTITY VERIFICATION':signup?'CREATE YOUR ACCOUNT':'WELCOME BACK'}</div><h1>${m?'Secure your account':signup?'Start your journey':'Sign in securely'}</h1><p class="muted">${m?'A second factor is required before accessing travel intelligence.':signup?'Create a client account for your organisation.':'Enter your credentials to access your dashboard.'}</p>${m?'':`<div class="tabs"><button class="${!signup?'selected':''}" onclick="auth('login')">Sign in</button><button class="${signup?'selected':''}" onclick="auth('signup')">Sign up</button></div>`}<div id="feedback" hidden></div>${m?mfaForm():`<form id="authform" onsubmit="doAuth(event)">${signup?'<label>Full name</label><input name="name" required maxlength="160" autocomplete="name" placeholder="Your full name"><label>Organisation / family name</label><input name="org" required maxlength="120" placeholder="Organisation name">':''}<label>Email address</label><input name="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input name="password" type="password" minlength="8" required autocomplete="${signup?'new-password':'current-password'}" placeholder="Minimum 8 characters"><button type="submit" class="gold submit">${signup?'Create account':'Sign in'} &nbsp; →</button></form><p style="text-align:center;margin-top:20px"><button onclick="resetPassword()" class="ghost" style="border:0;font-size:12px">Forgot password?</button></p>`}<p class="muted" style="font-size:11px;margin-top:30px">Protected by Supabase Auth · TOTP multi-factor authentication</p></div></section>`}
function mfaForm(){if(!state.mfa)return '';const x=state.mfa;return `${x.kind==='enroll'?`<div class="notice">Scan the QR code in an authenticator app (Google Authenticator, Microsoft Authenticator or similar). Then enter the six-digit code.</div><div style="text-align:center;margin:20px"><img src="${esc(x.qr)}" alt="Authenticator enrolment QR code" style="max-width:180px"></div><details><summary>Cannot scan? Enter setup key manually</summary><p style="word-break:break-all">${esc(x.secret)}</p></details>`:'<div class="notice">Enter the six-digit code from your registered authenticator app.</div>'}<form onsubmit="verifyMfa(event)"><label>Six-digit security code</label><input name="code" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required placeholder="000000"><button type="submit" class="gold submit">Verify and continue →</button></form><p><button onclick="logout()" style="border:0;background:none">Sign out</button></p>`}
async function doAuth(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await loading(async()=>{if(state.mode==='signup'){const {data,error}=await sb.auth.signUp({email:d.email,password:d.password,options:{data:{display_name:d.name,organization_name:d.org}}});if(error)throw error;if(data.session&&data.user){state.user=data.user;await gate();return}state.mode='login';auth('login');say('Registration submitted. Check your email for a confirmation link, then sign in.','success')}else{const {data,error}=await sb.auth.signInWithPassword({email:d.email,password:d.password});if(error)throw error;state.user=data.user;await gate()}})}
async function verifyMfa(e){e.preventDefault();const code=String(new FormData(e.target).get('code'));await loading(async()=>{const {error}=await sb.auth.mfa.challengeAndVerify({factorId:state.mfa.id,code});if(error)throw error;state.mfa=null;const {data}=await sb.auth.getUser();state.user=data.user;await gate()})}
async function resetPassword(){const email=prompt('Enter your account email for a password reset link:');if(!email)return;if(location.protocol==='file:')return say('Password recovery requires a hosted HTTPS URL. Open the deployed application to request a reset.','error');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});say(error?error.message:'If the account exists, a password reset email will be sent.',error?'error':'success')}
function showNewPassword(){$('root').innerHTML=`<section class="auth-layout"><div class="auth-visual"><div class="brand">✦ Arcangel IRI</div><div class="auth-title">Restore secure access.</div></div><div class="auth-card"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Choose a new password</h1><p class="muted">Set a new password. Multi-factor verification is still required before accessing intelligence records.</p><div id="feedback" hidden></div><form onsubmit="saveNewPassword(event)"><label>New password</label><input name="password" type="password" minlength="12" autocomplete="new-password" required><label>Confirm password</label><input name="confirm" type="password" minlength="12" autocomplete="new-password" required><button class="gold submit" type="submit">Update password</button></form></div></section>`}
async function saveNewPassword(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.password!==d.confirm)return say('Passwords do not match.','error');await loading(async()=>{const {error}=await sb.auth.updateUser({password:d.password});if(error)throw error;state.recovery=false;await sb.auth.signOut();state.user=null;auth('login');say('Password changed. Sign in again and complete 2FA.','success')})}
function onboard(){$('root').innerHTML=`<section class="auth-layout"><div class="auth-visual"><div class="brand">✦ Arcangel IRI</div><div class="auth-title">Welcome to secure travel intelligence.</div><div class="auth-feature">Your account has successfully passed two-factor authentication.</div></div><div class="auth-card"><div class="eyebrow">FINAL SETUP</div><h1>Set up your organisation</h1><p>Confirm the name of your organisation or family. It will be isolated from other client environments.</p><div id="feedback" hidden></div><form onsubmit="completeOnboarding(event)"><label>Your full name</label><input name="name" required value="${esc(state.user.user_metadata?.display_name||'')}"><label>Organisation or family name</label><input name="org" required value="${esc(state.user.user_metadata?.organization_name||'')}"><button class="gold submit" type="submit">Activate client portal →</button></form><button onclick="logout()" class="ghost">Sign out</button></div></section>`}
async function completeOnboarding(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));await loading(async()=>{const {error}=await sb.rpc('travel_bootstrap_profile',{display_name:d.name,org_name:d.org});if(error)throw error;await gate()})}
async function loadData(){const staff=['employee','admin'].includes(state.profile.role);const [rq,org,files]=await Promise.all([sb.from('travel_requests').select('*').order('created_at',{ascending:false}),sb.from('travel_organizations').select('id,name'),sb.from('travel_report_files').select('*').order('created_at',{ascending:false})]);for(const v of [rq,org,files])if(v.error)throw v.error;state.requests=rq.data||[];state.organizations=org.data||[];state.files=files.data||[];state.org=state.organizations.find(o=>o.id===state.profile.organization_id);state.staff=staff}
function navitems(){return state.staff?[['home','▦','Operations overview'],['queue','☷','Client requests'],['reports','▤','Report library'],['activity','◷','Audit activity'],['profile','♙','Profile & security']]:[['home','▦','Home base'],['request','⊕','Request report'],['reports','▤','My reports'],['destinations','◎','Destinations'],['map','◫','Risk map'],['profile','♙','Profile & security']]}
function shell(){if(!state.staff&&['queue','activity'].includes(state.page))state.page='home';$('root').innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><span class="mark">✦</span> Arcangel IRI<small>TRAVEL INTELLIGENCE</small></div><div class="account"><div class="avatar">${esc((state.profile.full_name||'A')[0].toUpperCase())}</div><div><b>${esc(state.staff?'Arcangel Concierge':state.org?.name||'Client')}</b><br><small>${esc(state.profile.full_name||state.user.email)}</small></div></div><div class="navhead">${state.staff?'CONCIERGE DESK':'DASHBOARD'}</div>${navitems().map(([id,icon,label])=>`<button class="nav ${state.page===id?'active':''}" onclick="go('${id}')"><i>${icon}</i>${esc(label)}</button>`).join('')}<div class="sidebottom"><b>${state.staff?'Employee workspace':'Private client environment'}</b><p style="margin:6px 0;color:#93a6b7">MFA verified · Secure session</p><button class="ghost" style="color:#fff;border-color:#4d6276;width:100%" onclick="logout()">Sign out ↗</button></div></aside><main class="main"><header class="topbar"><div><button class="mobile" onclick="$('sidebar').classList.toggle('open')">☰</button> &nbsp; ${state.staff?'Concierge Intelligence Desk':'Travel Intelligence'}</div><div class="topright"><span class="eyebrow">SECURE ACCESS</span><button onclick="refresh()">↻ Refresh</button></div></header><div class="page" id="view"></div></main></div>`;render()}
function go(p){state.page=p;state.selected=null;shell()}
async function refresh(){await loading(async()=>{await loadData();shell()})}
async function logout(){await sb.auth.signOut();state.user=null;state.profile=null;state.mfa=null;state.mode='login';auth('login')}
function head(k,title,desc,right=''){return `<div class="rowhead"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="muted">${desc}</p></div>${right}</div>`}
function requestRows(r){return r.length?`<div class="tablewrap"><table><thead><tr><th>DESTINATION</th><th>TYPE</th><th>STATUS</th><th>PRIORITY</th><th>DATE</th><th></th></tr></thead><tbody>${r.map(x=>`<tr><td><b>${esc(x.location||x.city||x.country)}</b><br><small>${esc(x.country)}</small></td><td>${esc(x.report_type)}</td><td>${pill(x.status)}</td><td>${esc(x.priority)}</td><td>${new Date(x.created_at).toLocaleDateString()}</td><td><button onclick="openRequest('${x.id}')">View →</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No intelligence requests found.</div>'}
function render(){const v=$('view');if(!v)return;const r=state.requests,counts={all:r.length,requested:r.filter(x=>x.status==='Requested').length,progress:r.filter(x=>['In progress','In review'].includes(x.status)).length,done:r.filter(x=>x.status==='Completed').length};if(state.selected){renderDetail();return}if(state.page==='home'){v.innerHTML=`<div class="hero"><div><div class="eyebrow">${state.staff?'INTELLIGENCE OPERATIONS':'TRAVEL INTELLIGENCE'}</div><h1>${state.staff?'Concierge Desk':'Welcome back'}</h1><p>${state.staff?'Manage client assessments, coordinate intelligence production and publish final reports.':'Request destination intelligence and receive detailed assessments from the Arcangel Concierge team.'}</p></div><button class="gold" onclick="go('${state.staff?'queue':'request'}')">${state.staff?'View request queue':'＋ Request new report'}</button></div><div class="stats">${[['▤','Total reports',counts.all],['◯','Requested',counts.requested],['⚙','In progress',counts.progress],['✓','Completed',counts.done]].map(x=>`<div class="card stat"><div class="ico">${x[0]}</div><div><div class="num">${x[2]}</div><b>${x[1]}</b><small>Live Supabase records</small></div></div>`).join('')}</div>${state.staff?`<div class="split2"><div class="card"><div class="rowhead"><h2>Client request queue</h2><button onclick="go('queue')">See all →</button></div>${requestRows(r.slice(0,6))}</div><div class="card"><div class="eyebrow">OPERATIONAL PRIORITIES</div><h2>Intelligence workflow</h2><p>Open a request to assign yourself, update its status, add internal notes or upload a PDF.</p><div class="notice">Only employees authorised in the database can access this workspace.</div></div></div>`:`<div class="split"><div class="card"><div class="rowhead"><div><div class="eyebrow">GLOBAL TRAVEL RISK</div><h2>Explore destinations</h2></div><button onclick="go('map')">Explore map ↗</button></div><div class="map"><div class="map-caption">Illustrative only · Not live travel-risk data</div></div></div><div class="card"><div class="eyebrow">REQUEST TRAVEL INTELLIGENCE</div><h2>Get started</h2><p class="muted">Select a destination scope and our concierge team will prepare your assessment.</p>${[['Country','◎','Country-level intelligence'],['City','▥','City risk and exposure'],['Specific location','♧','Precise location assessment']].map(o=>`<div class="options" onclick="go('request');$('rtype').value='${o[0]}'"><div class="symbol">${o[1]}</div><div><b>${o[0]} report</b><small>${o[2]}</small></div><div class="arrow">›</div></div>`).join('')}</div></div><div class="split2"><div class="card"><div class="rowhead"><h2>Recent reports</h2><button onclick="go('reports')">View all →</button></div>${requestRows(r.slice(0,5))}</div><div class="card"><div class="eyebrow">RECENT ACTIVITY</div><h2>Request updates</h2>${r.slice(0,5).map(x=>`<div class="list-item"><b>${esc(x.location||x.city||x.country)}</b> ${pill(x.status)}<br><small>Requested ${new Date(x.created_at).toLocaleString()}</small></div>`).join('')||'<div class="empty">No recent activity yet.</div>'}</div></div>`}`}
else if(state.page==='request'&&!state.staff){v.innerHTML=head('NEW INTELLIGENCE','Request a report','Your request will be securely delivered to the Arcangel Concierge Desk.')+`<div class="card panel"><div id="feedback" hidden></div><form onsubmit="submitRequest(event)"><div class="formgrid"><div><label>Report type *</label><select name="type" id="rtype"><option>Country</option><option>City</option><option>Specific location</option></select></div><div><label>Country *</label><input name="country" required maxlength="120" placeholder="e.g. South Africa"></div><div><label>City / region</label><input name="city" maxlength="120"></div><div><label>Specific location / address</label><input name="location" maxlength="250"></div><div><label>Start date</label><input name="start" type="date"></div><div><label>End date</label><input name="end" type="date"></div><div><label>Intelligence focus</label><select name="focus"><option>Comprehensive risk assessment</option><option>Security and crime</option><option>Political risk</option><option>Health and medical</option><option>Infrastructure and transport</option><option>Environmental hazards</option></select></div><div><label>Priority</label><select name="priority"><option>Standard</option><option>Urgent</option></select></div><div class="full"><label>Additional requirements</label><textarea name="notes" placeholder="Describe the purpose of travel, risks or areas for analysis. Avoid unnecessary personal details."></textarea></div></div><div class="notice">Your request is saved in Supabase and visible only to your organisation and authorised Arcangel staff.</div><div class="right"><button class="gold" type="submit">Submit intelligence request →</button></div></form></div>`}
else if(state.page==='reports'||state.page==='queue'){v.innerHTML=head('REPORT MANAGEMENT',state.staff?'Client requests':'My reports',state.staff?'Manage requests and prepare client intelligence packs.':'Track requests and access published PDF reports.',state.staff?'':`<button class="gold" onclick="go('request')">＋ New request</button>`)+`<div class="card"><div style="margin-bottom:15px"><input id="q" placeholder="Search by destination or status..." oninput="filterRows(this.value)"></div><div id="rows">${requestRows(r)}</div></div>`}
else if(state.page==='destinations'){v.innerHTML=head('DESTINATIONS','Your destinations','Locations covered by your intelligence requests.')+`<div class="stats">${r.map(x=>`<div class="card"><div class="eyebrow">${esc(x.report_type)}</div><h3>${esc(x.location||x.city||x.country)}</h3><p>${esc(x.country)}</p>${pill(x.status)}</div>`).join('')||'<div class="card">No destinations requested yet.</div>'}</div>`}
else if(state.page==='map'){v.innerHTML=head('TRAVEL INTELLIGENCE','Risk map','This map is illustrative and must not be used as an operational risk assessment.')+`<div class="card"><div class="map" style="height:480px"><div class="map-caption">Illustrative only · No live risk feed</div></div></div>`}
else if(state.page==='profile'){v.innerHTML=head('ACCOUNT','Profile & security','Your account is protected by Supabase authentication and TOTP MFA.')+`<div class="card panel"><h2>${esc(state.profile.full_name)}</h2><p><b>Email:</b> ${esc(state.user.email)}</p><p><b>Role:</b> ${esc(state.profile.role)}</p><p><b>Organisation:</b> ${esc(state.org?.name||'Arcangel Intelligence')}</p><p><b>Multi-factor:</b> Verified for this session</p><button onclick="logout()">Sign out of all workspaces</button></div>`}
else if(state.page==='activity'&&state.staff){v.innerHTML=head('OPERATIONS','Audit activity','Recent request actions visible to authorised staff.')+`<div class="card" id="audits">Loading audit records...</div>`;loadAudit()}else go('home')}
function filterRows(s){const q=s.toLowerCase();$('rows').innerHTML=requestRows(state.requests.filter(r=>JSON.stringify(r).toLowerCase().includes(q)))}
async function submitRequest(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.type==='City'&&!d.city.trim())return say('Enter a city for city assessments.','error');if(d.type==='Specific location'&&!d.location.trim())return say('Enter a specific location.','error');if(d.start&&d.end&&d.end<d.start)return say('End date must be after the start date.','error');await loading(async()=>{const {error}=await sb.from('travel_requests').insert({organization_id:state.profile.organization_id,created_by:state.user.id,report_type:d.type,country:d.country.trim(),city:d.city.trim()||null,location:d.location.trim()||null,travel_start:d.start||null,travel_end:d.end||null,focus:d.focus,priority:d.priority,notes:d.notes.trim()||null});if(error)throw error;await loadData();state.page='reports';shell();alert('Your intelligence request has been submitted to the Arcangel Concierge Desk.')})}
function openRequest(id){state.selected=id;shell()}
async function renderDetail(){let r=state.requests.find(x=>x.id===state.selected);if(!r){state.selected=null;go('reports');return}const f=state.files.filter(x=>x.request_id===r.id);$('view').innerHTML=`<button onclick="state.selected=null;go('${state.staff?'queue':'reports'}')">← Back to reports</button><div style="height:17px"></div>${head('REPORT DETAIL',esc(r.location||r.city||r.country),'Request ID: '+esc(r.id))}<div class="split2"><div class="card"><div class="eyebrow">DESTINATION AND REQUEST</div><h2>${esc(r.country)}</h2><p><b>Scope:</b> ${esc(r.report_type)}<br><b>City:</b> ${esc(r.city||'Not specified')}<br><b>Location:</b> ${esc(r.location||'Not specified')}<br><b>Travel:</b> ${esc(r.travel_start||'Not specified')} — ${esc(r.travel_end||'Not specified')}<br><b>Focus:</b> ${esc(r.focus)}<br><b>Priority:</b> ${esc(r.priority)}<br><b>Status:</b> ${pill(r.status)}</p><p>${esc(r.notes||'No additional requirements supplied.')}</p>${state.staff?`<div id="feedback" hidden></div><form onsubmit="updateRequest(event)"><div class="formgrid"><div><label>Workflow status</label><select name="status">${['Requested','In progress','In review','Completed','Cancelled'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Assigned analyst</label><select name="assigned"><option value="">Unassigned</option><option value="${state.user.id}" ${r.assigned_to===state.user.id?'selected':''}>Assign to myself</option></select></div></div><p><button type="submit" class="gold">Save workflow changes</button></p></form>`:''}</div><div class="card"><div class="eyebrow">SECURE REPORT LIBRARY</div><h2>PDF assessments</h2>${f.map(x=>`<div class="list-item"><b>📄 ${esc(x.filename)}</b><br><small>${x.published?'Published to client':'Internal draft'}</small><div class="actions" style="margin-top:9px"><button onclick="downloadFile('${x.storage_path.replace(/'/g,'')}')">Download PDF ↗</button>${state.staff?`<button onclick="publishFile('${x.id}',${!x.published})">${x.published?'Unpublish':'Publish to client'}</button>`:''}</div></div>`).join('')||'<div class="empty">No PDFs uploaded yet.</div>'}${state.staff?`<hr style="border:0;border-top:1px solid #eee;margin:20px 0"><h3>Upload intelligence report</h3><form onsubmit="uploadPdf(event)"><label>PDF report (max 20 MB)</label><input type="file" id="pdf" required accept="application/pdf,.pdf"><p><button class="gold" type="submit">Upload private PDF ↑</button></p></form><div class="notice">Uploads remain internal until you explicitly publish them.</div>`:''}</div></div><div class="card" style="margin-top:18px"><div class="eyebrow">CASE COMMUNICATIONS</div><h2>${state.staff?'Client and internal notes':'Messages from Arcangel'}</h2><div id="comments">Loading messages...</div><form onsubmit="addComment(event)"><label>Add a ${state.staff?'case note':'message'}</label><textarea name="body" required maxlength="4000"></textarea>${state.staff?'<p><label><input type="checkbox" name="internal" checked style="width:auto"> Internal staff-only note</label></p>':''}<button class="gold" type="submit">Save message</button></form></div>`;loadComments(r.id)}
async function updateRequest(e){e.preventDefault();if(!state.staff)return;const d=Object.fromEntries(new FormData(e.target));const {error}=await sb.from('travel_requests').update({status:d.status,assigned_to:d.assigned||null,updated_at:new Date().toISOString()}).eq('id',state.selected);if(error)return say(error.message,'error');await refresh();say('Request updated.','success')}
async function uploadPdf(e){e.preventDefault();if(!state.staff)return;const r=state.requests.find(x=>x.id===state.selected),file=$('pdf').files[0];if(!file||!file.name.toLowerCase().endsWith('.pdf')||file.size>20971520)return say('Choose a PDF smaller than 20 MB.','error');await loading(async()=>{const path=`${r.organization_id}/${r.id}/${crypto.randomUUID()}.pdf`;const uploaded=await sb.storage.from('travel-reports').upload(path,file,{contentType:'application/pdf',upsert:false});if(uploaded.error)throw uploaded.error;const saved=await sb.from('travel_report_files').insert({request_id:r.id,organization_id:r.organization_id,uploaded_by:state.user.id,filename:file.name,storage_path:path,published:false});if(saved.error){await sb.storage.from('travel-reports').remove([path]);throw saved.error}await refresh();say('PDF uploaded privately. Publish it when approved.','success')})}
async function publishFile(id,published){if(!state.staff)return;const {error}=await sb.from('travel_report_files').update({published}).eq('id',id);if(error)return alert(error.message);await refresh();alert(published?'Report published to the client.':'Report withdrawn from client access.')}
async function downloadFile(path){const {data,error}=await sb.storage.from('travel-reports').createSignedUrl(path,60,{download:true});if(error)return alert(error.message);const a=document.createElement('a');a.href=data.signedUrl;a.rel='noopener noreferrer';a.download='travel-intelligence-report.pdf';document.body.appendChild(a);a.click();a.remove()}
async function loadComments(id){const {data,error}=await sb.from('travel_request_comments').select('*').eq('request_id',id).order('created_at',{ascending:false});const e=$('comments');if(!e)return;e.innerHTML=error?`<div class="notice error">${esc(error.message)}</div>`:(data||[]).map(x=>`<div class="list-item"><small>${new Date(x.created_at).toLocaleString()} ${x.internal?'· Internal':''}</small><p>${esc(x.body)}</p></div>`).join('')||'<div class="empty">No case messages yet.</div>'}
async function addComment(e){e.preventDefault();const d=new FormData(e.target),body=String(d.get('body')||'').trim();if(!body)return;const {error}=await sb.from('travel_request_comments').insert({request_id:state.selected,author_id:state.user.id,body,internal:state.staff&&d.has('internal')});if(error)return alert(error.message);e.target.reset();await loadComments(state.selected)}
async function loadAudit(){const {data,error}=await sb.from('travel_audit_log').select('*').order('created_at',{ascending:false}).limit(75);const el=$('audits');if(!el)return;el.innerHTML=error?`<div class="notice error">${esc(error.message)}</div>`:(data||[]).map(x=>`<div class="list-item"><b>${esc(x.action)}</b> <small>${new Date(x.created_at).toLocaleString()}</small><br><small>Request: ${esc(x.request_id||'—')}</small></div>`).join('')||'<div class="empty">No audit events yet.</div>'}
start();
</script></body></html>
